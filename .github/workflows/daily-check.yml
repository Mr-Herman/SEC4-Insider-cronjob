name: Daily Insider Check

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Commas-separated tickers (leave blank to use secret)'
        required: false
        default: ''
      threshold:
        description: 'Minimum trade size in USD (leave blank to use secret)'
        required: false
        default: ''
      lookback:
        description: 'Days to look back (leave blank to use secret)'
        required: false
        default: ''
      update_defaults:
        description: 'Update cronjob default config? (saves provided values as secrets)'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-secrets:
    if: github.event.inputs.update_defaults == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update TICKERS secret
        uses: gliech/create-github-secret-action@v1
        with:
          name: TICKERS
          value: ${{ github.event.inputs.tickers }}
          pat: ${{ secrets.PAT }}
      - name: Update THRESHOLD secret
        uses: gliech/create-github-secret-action@v1
        with:
          name: THRESHOLD
          value: ${{ github.event.inputs.threshold }}
          pat: ${{ secrets.PAT }}
      - name: Update LOOKBACK secret
        uses: gliech/create-github-secret-action@v1
        with:
          name: LOOKBACK
          value: ${{ github.event.inputs.lookback }}
          pat: ${{ secrets.PAT }}

  check:
    runs-on: ubuntu-latest
    needs: update-secrets
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run bot
        env:
          DING_WEBHOOK_URL: ${{ secrets.DING_WEBHOOK_URL }}
          DING_WEBHOOK_SIGN: ${{ secrets.DING_WEBHOOK_SIGN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TICKERS: ${{ github.event.inputs.tickers || secrets.TICKERS }}
          THRESHOLD_USD: ${{ github.event.inputs.threshold || secrets.THRESHOLD }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback || secrets.LOOKBACK }}
        run: |
          echo "DING_WEBHOOK_URL is set: ${{ secrets.DING_WEBHOOK_URL != '' }}"
          echo "DING_WEBHOOK_SIGN is set: ${{ secrets.DING_WEBHOOK_SIGN != '' }}"
          mvn compile exec:java -Dexec.args="\
            ${{ github.event.inputs.tickers }} \
            --threshold=${{ github.event.inputs.threshold }} \
            --lookback=${{ github.event.inputs.lookback }}"
