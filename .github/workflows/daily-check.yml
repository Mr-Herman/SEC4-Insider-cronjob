name: Daily Insider Check

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Commas-separated tickers (leave blank to use secret)'
        required: false
        default: ''
      threshold:
        description: 'Minimum trade size in USD (leave blank to use secret)'
        required: false
        default: ''
      lookback:
        description: 'Days to look back (leave blank to use secret)'
        required: false
        default: ''
      job_type:
        description: 'Job type: form4, schedule13, all'
        required: false
        default: 'form4'
      update_defaults:
        description: 'Update cronjob default config? (saves provided values as secrets)'
        required: false
        default: 'false'
        type: boolean

  schedule:
    - cron: '37 4 * * *'   # 中国时间 12:37，自动触发默认跑 all
    # - cron: '37 1 * * *'   # 中国时间 09:37
    # - cron: '18 4 * * *'   # 中国时间 12:18
    # - cron: '43 12 * * *'  # 中国时间 20:43

jobs:
  update-secrets:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_defaults == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update TICKERS secret
        if: ${{ github.event.inputs.tickers != '' }}
        uses: gliech/create-github-secret-action@v1
        with:
          name: TICKERS
          value: ${{ github.event.inputs.tickers }}
          pat: ${{ secrets.PAT }}

      - name: Update THRESHOLD secret
        if: ${{ github.event.inputs.threshold != '' }}
        uses: gliech/create-github-secret-action@v1
        with:
          name: THRESHOLD
          value: ${{ github.event.inputs.threshold }}
          pat: ${{ secrets.PAT }}

      - name: Update LOOKBACK secret
        if: ${{ github.event.inputs.lookback != '' }}
        uses: gliech/create-github-secret-action@v1
        with:
          name: LOOKBACK
          value: ${{ github.event.inputs.lookback }}
          pat: ${{ secrets.PAT }}

  check:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - name: Show trigger type
        run: |
          echo "Trigger event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "China now: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S Asia/Shanghai')"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run bot
        env:
          DING_WEBHOOK_URL: ${{ secrets.DING_WEBHOOK_URL }}
          DING_WEBHOOK_SIGN: ${{ secrets.DING_WEBHOOK_SIGN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          TICKERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tickers != '' && github.event.inputs.tickers || secrets.TICKERS }}
          THRESHOLD_USD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.threshold != '' && github.event.inputs.threshold || secrets.THRESHOLD }}
          LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lookback != '' && github.event.inputs.lookback || secrets.LOOKBACK }}

          # workflow_dispatch 可以传 job_type；GitHub schedule 没有 inputs，所以默认跑 all
          JOB_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.job_type != '' && github.event.inputs.job_type || 'all' }}
        run: |
          echo "Trigger event: ${{ github.event_name }}"
          echo "JOB_TYPE=$JOB_TYPE"
          echo "DING_WEBHOOK_URL is set: ${{ secrets.DING_WEBHOOK_URL != '' }}"
          echo "DING_WEBHOOK_SIGN is set: ${{ secrets.DING_WEBHOOK_SIGN != '' }}"
          echo "TICKERS is set: ${{ secrets.TICKERS != '' }}"
          echo "THRESHOLD is set: ${{ secrets.THRESHOLD != '' }}"
          echo "LOOKBACK is set: ${{ secrets.LOOKBACK != '' }}"

          if [ -z "$TICKERS" ]; then
            echo "TICKERS is empty. Please set repository secret TICKERS or pass workflow input tickers."
            exit 1
          fi

          if [ -z "$LOOKBACK_DAYS" ]; then
            echo "LOOKBACK_DAYS is empty. Please set repository secret LOOKBACK or pass workflow input lookback."
            exit 1
          fi

          if [ "$JOB_TYPE" = "form4" ] || [ "$JOB_TYPE" = "all" ]; then
            if [ -z "$THRESHOLD_USD" ]; then
              echo "THRESHOLD_USD is empty. Please set repository secret THRESHOLD or pass workflow input threshold."
              exit 1
            fi
          fi

          if [ -z "$DING_WEBHOOK_URL" ] && [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Both DING_WEBHOOK_URL and DISCORD_WEBHOOK_URL are empty. Please configure at least one webhook."
            exit 1
          fi

          if [ "$JOB_TYPE" = "form4" ]; then
            echo "Running Form 4 insider bot only..."
            mvn compile exec:java -Dexec.mainClass=com.example.StockInsiderBot

          elif [ "$JOB_TYPE" = "schedule13" ]; then
            echo "Running Schedule 13D/13G bot only..."
            mvn compile exec:java -Dexec.mainClass=com.example.Schedule13Bot

          elif [ "$JOB_TYPE" = "all" ]; then
            echo "Running Form 4 insider bot..."
            mvn compile exec:java -Dexec.mainClass=com.example.StockInsiderBot

            echo "Running Schedule 13D/13G bot..."
            mvn compile exec:java -Dexec.mainClass=com.example.Schedule13Bot

          else
            echo "Invalid JOB_TYPE: $JOB_TYPE"
            echo "Allowed values: form4, schedule13, all"
            exit 1
          fi
