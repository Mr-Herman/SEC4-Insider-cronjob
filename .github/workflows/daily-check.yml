name: Daily Insider Check

'on':
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Commas-separated tickers (leave blank to use secret)'
        required: false
        default: ''
      threshold:
        description: 'Minimum trade size in USD (leave blank to use secret)'
        required: false
        default: ''
      lookback:
        description: 'Days to look back (leave blank to use secret)'
        required: false
        default: ''
      update_defaults:
        description: 'Update cronjob default config? (saves provided values as secrets)'
        required: false
        default: false
        type: boolean

  # 临时保留 push，提交后可以立刻验证 workflow 是否正常触发。
  # schedule 验证成功后，可以删除 push 这一段。
  push:
    branches:
      - master

  schedule:
    - cron: '*/5 * * * *'

jobs:
  update-secrets:
    name: Update default secrets
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_defaults == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PAT
        run: |
          if [ -z "$PAT" ]; then
            echo "PAT is empty. Cannot update repository secrets."
            exit 1
          fi
        env:
          PAT: ${{ secrets.PAT }}

      - name: Update TICKERS secret
        if: ${{ github.event.inputs.tickers != '' }}
        uses: gliech/create-github-secret-action@v1
        with:
          name: TICKERS
          value: ${{ github.event.inputs.tickers }}
          pat: ${{ secrets.PAT }}

      - name: Update THRESHOLD secret
        if: ${{ github.event.inputs.threshold != '' }}
        uses: gliech/create-github-secret-action@v1
        with:
          name: THRESHOLD
          value: ${{ github.event.inputs.threshold }}
          pat: ${{ secrets.PAT }}

      - name: Update LOOKBACK secret
        if: ${{ github.event.inputs.lookback != '' }}
        uses: gliech/create-github-secret-action@v1
        with:
          name: LOOKBACK
          value: ${{ github.event.inputs.lookback }}
          pat: ${{ secrets.PAT }}

  check:
    name: Run daily insider check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DING_WEBHOOK_URL: ${{ secrets.DING_WEBHOOK_URL }}
      DING_WEBHOOK_SIGN: ${{ secrets.DING_WEBHOOK_SIGN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      TICKERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tickers != '' && github.event.inputs.tickers || secrets.TICKERS }}
      THRESHOLD_USD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.threshold != '' && github.event.inputs.threshold || secrets.THRESHOLD }}
      LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lookback != '' && github.event.inputs.lookback || secrets.LOOKBACK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show trigger info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"
          echo "repository=${{ github.repository }}"
          echo "workflow=${{ github.workflow }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_number=${{ github.run_number }}"
          echo "utc_now=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "local_now=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S Asia/Shanghai')"

      - name: Validate environment variables
        run: |
          echo "DING_WEBHOOK_URL length: ${#DING_WEBHOOK_URL}"
          echo "DING_WEBHOOK_SIGN length: ${#DING_WEBHOOK_SIGN}"
          echo "DISCORD_WEBHOOK_URL length: ${#DISCORD_WEBHOOK_URL}"
          echo "TICKERS=$TICKERS"
          echo "THRESHOLD_USD=$THRESHOLD_USD"
          echo "LOOKBACK_DAYS=$LOOKBACK_DAYS"

          if [ -z "$TICKERS" ]; then
            echo "TICKERS is empty. Please set repository secret TICKERS or pass workflow input tickers."
            exit 1
          fi

          if [ -z "$THRESHOLD_USD" ]; then
            echo "THRESHOLD_USD is empty. Please set repository secret THRESHOLD or pass workflow input threshold."
            exit 1
          fi

          if [ -z "$LOOKBACK_DAYS" ]; then
            echo "LOOKBACK_DAYS is empty. Please set repository secret LOOKBACK or pass workflow input lookback."
            exit 1
          fi

          if [ -z "$DING_WEBHOOK_URL" ] && [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Both DING_WEBHOOK_URL and DISCORD_WEBHOOK_URL are empty. Please configure at least one webhook."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run bot
        run: |
          echo "Schedule trigger test passed. Skip Java bot for now."
          # mvn compile exec:java
          
