name: Daily Insider Check

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (leave blank to use secret)"
        required: false
        default: ""
      threshold:
        description: "Minimum trade size in USD (leave blank to use secret)"
        required: false
        default: ""
      lookback:
        description: "Days to look back (leave blank to use secret)"
        required: false
        default: ""
      update_config:
        description: "Update cronjob default config? (saves provided values as secrets)"
        type: boolean
        required: false
        default: false

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DING_WEBHOOK_URL: ${{ secrets.DING_WEBHOOK_URL }}
  DING_WEBHOOK_SIGN: ${{ secrets.DING_WEBHOOK_SIGN }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
  TICKERS: ${{ github.event.inputs.tickers || secrets.TICKERS }}
  THRESHOLD_USD: ${{ github.event.inputs.threshold || secrets.THRESHOLD }}
  LOOKBACK_DAYS: ${{ github.event.inputs.lookback || secrets.LOOKBACK }}

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_config == 'true'
    steps:
      - name: Update TICKERS secret
        if: github.event.inputs.tickers != ''
        uses: gliech/create-github-secret-action@v1
        with:
          name: TICKERS
          value: ${{ github.event.inputs.tickers }}
          pa_token: ${{ secrets.PAT }}

      - name: Update THRESHOLD secret
        if: github.event.inputs.threshold != ''
        uses: gliech/create-github-secret-action@v1
        with:
          name: THRESHOLD
          value: ${{ github.event.inputs.threshold }}
          pa_token: ${{ secrets.PAT }}

      - name: Update LOOKBACK secret
        if: github.event.inputs.lookback != ''
        uses: gliech/create-github-secret-action@v1
        with:
          name: LOOKBACK
          value: ${{ github.event.inputs.lookback }}
          pa_token: ${{ secrets.PAT }}

  check:
    runs-on: ubuntu-latest
    needs: update-secrets   # 先更新 secret（若跳过则直接往下）
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run bot
        run: |
          mvn compile exec:java -Dexec.args="${{ env.TICKERS }} --threshold=${{ env.THRESHOLD_USD }} --lookback=${{ env.LOOKBACK_DAYS }}"